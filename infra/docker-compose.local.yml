services:
  aura-server:
    build:
      context: ..
      dockerfile: infra/docker/server.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../server/.env.example
    environment:
      - DOWNLOADS_DIR=/app/downloads
      - POT_PROVIDER_URL=http://pot-provider:4416/token
    depends_on:
      - pot-provider

  pot-provider:
    image: ghcr.io/jim60105/bgutil-pot:latest
    container_name: pot-provider-local
    restart: always
    ports:
      - "4416:4416"

