<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AURA Music Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0d0d0d;
            font-family: 'Outfit', sans-serif;
            color: #FFFFFF;
        }
        #webApp {
            width: 100%;
            height: 100%;
        }
        #wasm-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d0d0d;
            z-index: 9999;
            transition: opacity 0.4s ease-out;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 85, 0, 0.2);
            border-top-color: #FF5500;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-title {
            margin-top: 18px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #FF5500;
        }
        .loader-sub {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #888888;
        }
    </style>
</head>
<body>
    <div id="wasm-loader">
        <div class="spinner"></div>
        <div class="loader-title">AURA</div>
        <div class="loader-sub">Initialisation du moteur WebAssembly...</div>
    </div>
    <div id="webApp"></div>
    <script src="webApp.js"></script>
</body>
</html>
